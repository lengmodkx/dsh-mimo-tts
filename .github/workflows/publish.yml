name: publish

# Publishing needs one repository secret: NPM_TOKEN — an npm *Automation* token
# from https://www.npmjs.com/settings/<user>/tokens (Automation tokens skip 2FA,
# which is what a CI runner needs). Without the secret the job stops at the
# smoke test and nothing is published.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
      - name: Offline smoke test
        run: node test/smoke.mjs
      - name: Publish to npm
        if: ${{ secrets.NPM_TOKEN != '' }}
        run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Explain the skip
        if: ${{ secrets.NPM_TOKEN == '' }}
        run: echo "NPM_TOKEN is not configured, so the package was not published. Add it under Settings → Secrets and variables → Actions."
